name: OpenEFBMobile
options:
  bundleIdPrefix: org.openefb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  OpenEFBMobile:
    type: application
    platform: iOS
    sources:
      - OpenEFBMobile
    info:
      path: OpenEFBMobile/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openefb.mobile
        PRODUCT_NAME: OpenEFB Mobile
        CODE_SIGN_STYLE: Automatic
  OpenEFBMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenEFBMobileTests
    dependencies:
      - target: OpenEFBMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openefb.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
